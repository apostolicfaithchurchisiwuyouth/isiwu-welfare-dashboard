<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#4a0754"
    >

    <meta
        name="description"
        content="AFC Isiu Youth Portal — Weekly Bible Lessons"
    >

    <title>Weekly Lessons — AFC Isiu Youth Portal</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICONS
    ====================================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- =====================================================
         PORTAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/lessons.css"
    >

</head>


<body>


<div class="app-shell">


    <!-- =====================================================
         MOBILE OVERLAY
    ====================================================== -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
    ></div>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- BRAND -->

        <div class="sidebar-brand">

            <div class="brand-mark">

                <span data-lucide="church"></span>

            </div>


            <div class="brand-text">

                <strong>
                    AFC Isiu
                </strong>

                <span>
                    Youth Portal
                </span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav
            class="sidebar-navigation"
            aria-label="Main navigation"
        >


            <a
                href="../index.html"
                class="nav-item"
            >

                <span data-lucide="house"></span>

                <span>
                    Home
                </span>

            </a>


            <a
                href="lessons.html"
                class="nav-item active"
                aria-current="page"
            >

                <span data-lucide="book-open"></span>

                <span>
                    Lessons
                </span>

            </a>


            <a
                href="quiz.html"
                class="nav-item"
            >

                <span data-lucide="clipboard-check"></span>

                <span>
                    Quiz
                </span>

            </a>


            <a
                href="gallery.html"
                class="nav-item"
            >

                <span data-lucide="images"></span>

                <span>
                    Gallery
                </span>

            </a>


            <a
                href="profile.html"
                class="nav-item member-only"
                hidden
            >

                <span data-lucide="user-round"></span>

                <span>
                    Profile
                </span>

            </a>


            <a
                href="notifications.html"
                class="nav-item member-only"
                hidden
            >

                <span data-lucide="bell"></span>

                <span>
                    Notifications
                </span>

                <span
                    class="notification-badge"
                    id="desktopNotificationBadge"
                    hidden
                >
                    0
                </span>

            </a>

        </nav>


        <!-- =================================================
             SIDEBAR FOOTER
        ================================================== -->

        <div class="sidebar-footer">


            <!-- GUEST -->

            <div
                class="sidebar-guest"
                id="sidebarGuest"
            >

                <div class="sidebar-guest-icon">

                    <span data-lucide="user-round"></span>

                </div>


                <div class="sidebar-guest-copy">

                    <strong>
                        Welcome
                    </strong>

                    <small>
                        Sign in to access your account
                    </small>

                </div>

            </div>


            <!-- MEMBER -->

            <div
                class="sidebar-member"
                id="sidebarMember"
                hidden
            >

                <a
                    href="profile.html"
                    class="sidebar-profile"
                >

                    <div class="avatar">

                        <span id="sidebarAvatar">
                            A
                        </span>

                    </div>


                    <div>

                        <strong id="sidebarUserName">
                            Member
                        </strong>

                        <small>
                            My Profile
                        </small>

                    </div>

                </a>


                <button
                    type="button"
                    class="sidebar-logout"
                    id="sidebarLogoutButton"
                >

                    <span data-lucide="log-out"></span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN AREA
    ====================================================== -->

    <main class="main-area">


        <!-- =================================================
             TOP HEADER
        ================================================== -->

        <header class="top-header">


            <div class="header-left">


                <button
                    type="button"
                    class="icon-button mobile-menu-button"
                    id="mobileMenuButton"
                    aria-label="Open navigation menu"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >

                    <span data-lucide="menu"></span>

                </button>


                <a
                    href="../index.html"
                    class="mobile-brand"
                    aria-label="AFC Isiu Youth Portal Home"
                >

                    <span class="mobile-brand-icon">

                        <span data-lucide="church"></span>

                    </span>


                    <span class="mobile-brand-text">

                        <strong>
                            AFC Isiu
                        </strong>

                        <small>
                            Youth Portal
                        </small>

                    </span>

                </a>

            </div>


            <div class="header-actions">


                <a
                    href="notifications.html"
                    class="header-icon-button member-only"
                    id="headerNotificationButton"
                    hidden
                    aria-label="Notifications"
                >

                    <span data-lucide="bell"></span>

                    <span
                        class="header-notification-dot"
                        id="headerNotificationDot"
                        hidden
                    ></span>

                </a>


                <a
                    href="profile.html"
                    class="header-avatar member-only"
                    id="headerAccountButton"
                    hidden
                    aria-label="Profile"
                >

                    <span
                        id="headerAvatarContent"
                        class="header-avatar-content"
                    >

                        <span data-lucide="user-round"></span>

                    </span>

                </a>


                <a
                    href="../login.html"
                    class="header-avatar guest-account-avatar"
                    id="guestHeaderAccountButton"
                    aria-label="Login"
                >

                    <span class="header-avatar-content">

                        <span data-lucide="user-round"></span>

                    </span>

                </a>

            </div>

        </header>


        <!-- =================================================
             LESSON PAGE
        ================================================== -->

        <section
            class="page-content lessons-page-content"
            id="lessonsPage"
        >

            <!-- lessons.js renders everything here -->

            <div
                class="lessons-loading-state"
                id="lessonsLoading"
            >

                <div class="lesson-loading-icon">

                    <span data-lucide="book-open"></span>

                </div>

                <h1>
                    Loading weekly lessons...
                </h1>

                <p>
                    Please wait while we bring you this week's lessons.
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         MOBILE BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        class="bottom-navigation"
        aria-label="Mobile navigation"
    >


        <a
            href="../index.html"
            class="bottom-nav-item"
        >

            <span
                class="bottom-nav-icon"
                data-lucide="house"
            ></span>

            <span class="bottom-nav-label">
                Home
            </span>

        </a>


        <a
            href="lessons.html"
            class="bottom-nav-item active"
            aria-current="page"
        >

            <span
                class="bottom-nav-icon"
                data-lucide="book-open"
            ></span>

            <span class="bottom-nav-label">
                Lessons
            </span>

        </a>


        <a
            href="quiz.html"
            class="bottom-nav-item bottom-nav-center"
            aria-label="Quiz"
        >

            <span class="bottom-nav-main">

                <span
                    data-lucide="clipboard-check"
                    class="bottom-nav-main-icon"
                ></span>

            </span>

            <span class="bottom-nav-center-label">
                Quiz
            </span>

        </a>


        <a
            href="gallery.html"
            class="bottom-nav-item"
        >

            <span
                class="bottom-nav-icon"
                data-lucide="images"
            ></span>

            <span class="bottom-nav-label">
                Gallery
            </span>

        </a>


        <a
            href="../login.html"
            class="bottom-nav-item"
            id="guestBottomProfile"
        >

            <span
                class="bottom-nav-icon"
                data-lucide="user-round"
            ></span>

            <span class="bottom-nav-label">
                Account
            </span>

        </a>


        <a
            href="profile.html"
            class="bottom-nav-item member-bottom-profile member-only"
            id="memberBottomProfile"
            hidden
        >

            <span
                class="bottom-avatar"
                id="bottomAvatar"
            >
                A
            </span>

            <span
                class="bottom-nav-label"
            >
                Profile
            </span>

        </a>

    </nav>

</div>


<!-- =====================================================
     APPLICATION SCRIPTS
====================================================== -->

<script src="../js/config.js"></script>

<script src="../js/api.js"></script>

<script src="../js/global-loader.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/auth-state.js"></script>

<script src="../js/app.js"></script>

<script src="../js/pages/lessons.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (
            window.lucide &&
            typeof window.lucide.createIcons === "function"
        ) {

            window.lucide.createIcons();

        }

    }
);

</script>


</body>

</html>
