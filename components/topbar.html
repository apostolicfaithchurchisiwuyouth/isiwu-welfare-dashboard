<!-- ============================================================
     AFC ISIU YOUTH PORTAL
     SHARED TOPBAR
============================================================ -->

<header
    class="topbar"
    id="topbar"
>

    <div class="topbar-left">

        <!-- MOBILE MENU -->

        <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            <i class="fa-solid fa-bars"></i>
        </button>


        <!-- BRAND -->

        <div class="portal-brand">

            <img
                src="/images/logo.png"
                alt="AFC Logo"
                class="portal-logo"
            >

            <div>

                <h2>
                    AFC Isiu Youth
                </h2>

                <p>
                    Building young people for Christ
                </p>

            </div>

        </div>

    </div>


    <!-- ========================================================
         TOPBAR ACTIONS
    ========================================================= -->

    <div class="topbar-right">

        <!-- NOTIFICATION -->

        <div
            class="notification-wrapper"
            id="notificationWrapper"
        >

            <button
                class="header-icon"
                id="notificationBtn"
                type="button"
                aria-label="Notification settings"
                aria-expanded="false"
                aria-controls="notificationPanel"
            >

                <i
                    class="fa-regular fa-bell"
                    id="notificationIcon"
                ></i>

                <span
                    class="notify-dot"
                    id="notifyDot"
                ></span>

            </button>


            <div
                id="notificationPanelContainer"
            ></div>

        </div>


        <!-- THEME -->

        <button
            class="header-icon"
            id="themeBtn"
            type="button"
            aria-label="Change theme"
        >

            <i
                class="fa-solid fa-moon"
                id="themeIcon"
            ></i>

        </button>

    </div>

</header>
