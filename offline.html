<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0A0016"
    >

    <meta
        name="description"
        content="AFC Isiu Youth Portal offline page"
    >

    <title>You're Offline | AFC Isiu Youth</title>

    <link
        rel="icon"
        type="image/png"
        href="/images/logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="/images/logo.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                24px;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            color:
                #0f172a;

            background:
                #f7f7fb;

            overflow-x: hidden;

        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .page-background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 0;

        }


        .page-background::before {

            content: "";

            position: absolute;

            width: 420px;

            height: 420px;

            top: -180px;

            right: -160px;

            border-radius: 50%;

            background:
                rgba(234, 88, 12, .10);

            filter:
                blur(10px);

        }


        .page-background::after {

            content: "";

            position: absolute;

            width: 360px;

            height: 360px;

            bottom: -180px;

            left: -140px;

            border-radius: 50%;

            background:
                rgba(74, 7, 84, .10);

            filter:
                blur(10px);

        }


        /* =====================================================
           MAIN CARD
           ===================================================== */

        .offline-container {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 450px;

            padding:
                38px 30px 30px;

            text-align: center;

            background:
                rgba(255, 255, 255, .94);

            border:
                1px solid
                rgba(15, 23, 42, .06);

            border-radius:
                30px;

            box-shadow:
                0 30px 80px
                rgba(15, 23, 42, .10);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            animation:
                cardEnter .55s ease both;

        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-wrap {

            width: 78px;

            height: 78px;

            margin:
                0 auto 22px;

            padding: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 24px;

            background:
                #ffffff;

            box-shadow:
                0 12px 30px
                rgba(15, 23, 42, .10);

        }


        .logo-wrap img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            border-radius: 16px;

        }


        /* =====================================================
           CONNECTION ICON
           ===================================================== */

        .offline-icon {

            width: 74px;

            height: 74px;

            margin:
                0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background:
                #fff1e8;

            color:
                #ea580c;

            font-size:
                28px;

            position: relative;

        }


        .offline-icon::after {

            content: "";

            position: absolute;

            inset: -7px;

            border:
                1px solid
                rgba(234, 88, 12, .16);

            border-radius: 27px;

            animation:
                pulseRing 2s ease-out infinite;

        }


        /* =====================================================
           TEXT
           ===================================================== */

        h1 {

            font-family:
                "Bricolage Grotesque",
                Arial,
                sans-serif;

            font-size:
                clamp(1.55rem, 5vw, 1.9rem);

            line-height:
                1.15;

            font-weight:
                700;

            letter-spacing:
                -.025em;

            color:
                #0f172a;

            margin-bottom:
                12px;

        }


        .offline-message {

            max-width:
                360px;

            margin:
                0 auto 24px;

            color:
                #64748b;

            font-size:
                .92rem;

            line-height:
                1.65;

        }


        /* =====================================================
           STATUS CARD
           ===================================================== */

        .offline-note {

            display:
                flex;

            align-items:
                flex-start;

            gap:
                12px;

            padding:
                15px 16px;

            margin-bottom:
                24px;

            text-align:
                left;

            border:
                1px solid
                #e2e8f0;

            border-radius:
                17px;

            background:
                #f8fafc;

            color:
                #475569;

            font-size:
                .82rem;

            line-height:
                1.5;

        }


        .offline-note-icon {

            flex:
                0 0 auto;

            width:
                34px;

            height:
                34px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                11px;

            background:
                #fff1e8;

            color:
                #ea580c;

        }


        .offline-note strong {

            display:
                block;

            margin-bottom:
                2px;

            color:
                #334155;

            font-size:
                .82rem;

        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .offline-actions {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

        }


        button,
        a {

            width:
                100%;

            min-height:
                50px;

            border:
                none;

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                9px;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            font-size:
                .88rem;

            font-weight:
                700;

            text-decoration:
                none;

            cursor:
                pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;

        }


        button:hover,
        a:hover {

            transform:
                translateY(-2px);

        }


        button:active,
        a:active {

            transform:
                translateY(0);

        }


        .retry-btn {

            background:
                #ea580c;

            color:
                #ffffff;

            box-shadow:
                0 10px 24px
                rgba(234, 88, 12, .20);

        }


        .retry-btn:hover {

            box-shadow:
                0 14px 30px
                rgba(234, 88, 12, .27);

        }


        .home-btn {

            background:
                #f1f5f9;

            color:
                #334155;

        }


        .home-btn:hover {

            background:
                #e8edf3;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .offline-status {

            margin-top:
                24px;

            padding-top:
                18px;

            border-top:
                1px solid
                #eef1f5;

            color:
                #94a3b8;

            font-size:
                .72rem;

            letter-spacing:
                .01em;

        }


        /* =====================================================
           ANIMATIONS
           ===================================================== */

        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(12px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes pulseRing {

            0% {

                opacity: .65;

                transform:
                    scale(.94);

            }

            70% {

                opacity: 0;

                transform:
                    scale(1.08);

            }

            100% {

                opacity: 0;

                transform:
                    scale(1.08);

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            body {

                padding:
                    16px;

            }


            .offline-container {

                padding:
                    30px 20px 24px;

                border-radius:
                    26px;

            }


            .logo-wrap {

                width:
                    68px;

                height:
                    68px;

                border-radius:
                    21px;

                margin-bottom:
                    18px;

            }


            .offline-icon {

                width:
                    68px;

                height:
                    68px;

                margin-bottom:
                    20px;

            }


            .offline-message {

                font-size:
                    .87rem;

            }

        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        @media (prefers-color-scheme: dark) {

            body {

                background:
                    #0a0016;

                color:
                    #ffffff;

            }


            .page-background::before {

                background:
                    rgba(234, 88, 12, .13);

            }


            .page-background::after {

                background:
                    rgba(74, 7, 84, .18);

            }


            .offline-container {

                background:
                    rgba(24, 20, 31, .94);

                border-color:
                    rgba(255, 255, 255, .07);

                box-shadow:
                    0 30px 80px
                    rgba(0, 0, 0, .35);

            }


            .logo-wrap {

                background:
                    #18141f;

            }


            h1 {

                color:
                    #ffffff;

            }


            .offline-message {

                color:
                    #c5c5c5;

            }


            .offline-note {

                background:
                    rgba(255, 255, 255, .04);

                border-color:
                    rgba(255, 255, 255, .07);

                color:
                    #c5c5c5;

            }


            .offline-note strong {

                color:
                    #ffffff;

            }


            .home-btn {

                background:
                    rgba(255, 255, 255, .08);

                color:
                    #ffffff;

            }


            .home-btn:hover {

                background:
                    rgba(255, 255, 255, .12);

            }


            .offline-status {

                border-color:
                    rgba(255, 255, 255, .07);

                color:
                    #8d8d98;

            }

        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            .offline-container,
            .offline-icon::after {

                animation:
                    none;

            }


            button,
            a {

                transition:
                    none;

            }

        }

    </style>

</head>


<body>

    <div
        class="page-background"
        aria-hidden="true"
    ></div>


    <main class="offline-container">

        <div class="logo-wrap">

            <img
                src="/images/logo.png"
                alt="AFC Isiu Youth"
            >

        </div>


        <div
            class="offline-icon"
            aria-hidden="true"
        >

            <i class="fa-solid fa-wifi"></i>

        </div>


        <h1>
            You're currently offline
        </h1>


        <p class="offline-message">

            We couldn't connect to the internet
            right now, so this page cannot load
            fresh information.

        </p>


        <div class="offline-note">

            <div
                class="offline-note-icon"
                aria-hidden="true"
            >

                <i class="fa-solid fa-cloud-arrow-down"></i>

            </div>


            <div>

                <strong>
                    Your connection is unavailable
                </strong>

                Please switch on your mobile data
                or connect to Wi-Fi, then try again.

            </div>

        </div>


        <div class="offline-actions">

            <button
                class="retry-btn"
                type="button"
                onclick="retryPage()"
            >

                <i class="fa-solid fa-rotate-right"></i>

                Try Again

            </button>


            <a
                class="home-btn"
                href="/"
            >

                <i class="fa-solid fa-house"></i>

                Go to Home

            </a>

        </div>


        <p class="offline-status">

            AFC Isiu Youth Portal

        </p>

    </main>


    <script>

        function retryPage() {

            window.location.reload();

        }

    </script>

</body>

</html>
