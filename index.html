<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        
        // =========================================================================
        // GOOGLE APPS SCRIPT BACKEND CONFIGURATION
        // Replace APPS_SCRIPT_URL with your Google Apps Script Web App Deployment URL
        // =========================================================================
        const APPS_SCRIPT_URL = ""; // e.g., "https://script.google.com/macros/s/AKfycbx.../exec"

        // Sample Comprehensive Lesson Dataset
        const LESSONS_DATA = [
            {
                id: "lesson-wk-1",
                week: 1,
                title: "Walking by Faith, Not by Sight",
                subtitle: "Trusting God's Unchanging Character in Times of Uncertainty",
                category: "Faith & Trust",
                duration: "18 min read",
                scriptureRef: "2 Corinthians 5:6-10",
                scriptureText: "So we are always of good courage. We know that while we are at home in the body we are away from the Lord, for we walk by faith, not by sight. Yes, we are of good courage, and we would rather be away from the body and at home with the Lord. So whether we are at home or away, we make it our aim to please him.",
                memoryVerse: {
                    reference: "2 Corinthians 5:7",
                    textEng: "For we walk by faith, not by sight.",
                    textYoruba: "Nítorí pé nípa ìgbàgbọ́ ni àwa ń rìn, eè ṣe nípa ìríran.",
                    phoneticsYoruba: "Nee-toh-ree pay nee-pah eeg-bah-gbaw nee ah-wah n reen, eh-eh sheh nee-pah ee-ree-ran."
                },
                introduction: "Welcome to this week's study. Living in a world full of visual noise, economic challenges, and unpredictable news makes walking by physical sight tempting. However, God calls believers to elevate their focus beyond natural circumstances to the divine promises of Scripture.",
                sections: [
                    {
                        title: "1. The Definition and Essence of Biblical Faith",
                        content: "Biblical faith is not wishful thinking or blind optimism. Hebrews 11:1 defines it as the substance of things hoped for and the evidence of things not seen. True faith is anchored in the integrity of God's character and word."
                    },
                    {
                        title: "2. The Danger of Sight-Driven Decisions",
                        content: "Sight-driven living makes our peace dependent on external conditions. When the Israelites looked at the giants in Canaan, sight produced fear. When Joshua and Caleb looked through faith, they saw victory."
                    },
                    {
                        title: "3. Overcoming Visual and Mental Distractions",
                        content: "When Peter walked on water, he took bold steps until he looked down at the physical wind and waves. Focusing on physical obstacles depletes spiritual strength, whereas fixing our eyes on Jesus stabilizes our walk."
                    },
                    {
                        title: "4. The Renewal of Mind and Vision",
                        content: "Walking by faith requires daily renewal of our minds through Scripture. By immersing ourselves in biblical promises, we train our spiritual eyes to perceive God's hand in difficult situations."
                    },
                    {
                        title: "5. Courage in the Midst of Trials",
                        content: "A key aspect of Paul's teaching in 2 Corinthians 5 is 'good courage'. Christian courage is not the absence of fear, but the conviction that God is present and active even when unseen."
                    },
                    {
                        title: "6. Practical Steps for Daily Faith Walk",
                        content: "Begin each day by committing your plans to God. Replace moments of worry with deliberate thanksgiving. Speak Scripture over your challenges instead of echoing human anxieties."
                    }
                ],
                conclusion: "Walking by faith is a daily practice. As you go through this week, choose to trust God's promises over shifting feelings or visible circumstances. Eternal rewards await those who maintain steadfast trust in Him.",
                reflectionPrompts: [
                    { id: 'r1', label: "Key Lesson Revelation", question: "What is the single most important lesson or verse that stood out to you in this reading, and why?" },
                    { id: 'r2', label: "Personal Application", question: "Which specific area of your life (family, career, studies, finance) currently requires you to walk by faith rather than sight?" },
                    { id: 'r3', label: "Practical Commitment", question: "What concrete action step will you take this week to demonstrate your trust in God's promises?" }
                ],
                // Bank of 30 Quiz Questions for Week 1
                quiz: Array.from({ length: 30 }, (_, index) => {
                    const qNum = index + 1;
                    if (qNum === 1) return { id: `q1`, question: "According to 2 Corinthians 5:7, how are believers instructed to walk?", options: ["By feelings & emotions", "By faith, not by sight", "By human logic", "By physical vision"], correctAnswer: 1, explanation: "2 Corinthians 5:7 explicitly states 'we walk by faith, not by sight'." };
                    if (qNum === 2) return { id: `q2`, question: "What is the Yoruba memory verse translation for 2 Corinthians 5:7?", options: ["Nítorí pé nípa ìgbàgbọ́ ni àwa ń rìn", "Ọlọ́run ni àpáta mímọ́ wa", "Ẹ má ṣe pàyà ní ohun kankan", "Àláàfíà fún gbogbo yín"], correctAnswer: 0, explanation: "'Nítorí pé nípa ìgbàgbọ́ ni àwa ń rìn, eè ṣe nípa ìríran' is the standard Yoruba scriptural translation." };
                    if (qNum === 3) return { id: `q3`, question: "What happened when Peter took his eyes off Jesus while walking on water?", options: ["He flew higher", "He began to sink due to wind and waves", "He instantly reached the shore", "He turned back into the boat"], correctAnswer: 1, explanation: "Peter sank when he shifted his focus from Jesus to the natural storm around him." };
                    if (qNum === 4) return { id: `q4`, question: "How does Hebrews 11:1 define faith?", options: ["Substance of things hoped for, evidence of unseen", "A psychological feeling of joy", "An ancient tradition", "A reward earned by good works"], correctAnswer: 0, explanation: "Hebrews 11:1 defines faith as the substance of things hoped for and evidence of things not seen." };
                    if (qNum === 5) return { id: `q5`, question: "What is a primary characteristic of living 'by sight'?", options: ["Unshakable peace", "Depending on fluctuating physical circumstances", "Continuous divine revelations", "Total victory over anxiety"], correctAnswer: 1, explanation: "Living by sight ties your confidence to changing physical environments." };
                    
                    return {
                        id: `q${qNum}`,
                        question: `[Week 1 Question ${qNum}] In walking by faith, what is expected when facing trial ${qNum}?`,
                        options: [
                            `Option A for question ${qNum}`,
                            `Relying on God's word and steadfast promises`,
                            `Giving up immediately`,
                            `Relying solely on human effort`
                        ],
                        correctAnswer: 1,
                        explanation: `Scripture reminds us in section ${(qNum % 6) + 1} that trusting God's word yields steadfast victory.`
                    };
                })
            },
            {
                id: "lesson-wk-2",
                week: 2,
                title: "The Power of Persistent Prayer",
                subtitle: "Exchanging Daily Anxiety for Divine Peace",
                category: "Prayer & Devotion",
                duration: "15 min read",
                scriptureRef: "Philippians 4:6-7",
                scriptureText: "Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.",
                memoryVerse: {
                    reference: "Philippians 4:6",
                    textEng: "Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.",
                    textYoruba: "Ẹ má ṣe àníyàn nípa ohunkóhun; ṣùgbọ́n ní nǹkan gbogbo, nípa àdúrà àti ẹ̀bẹ̀ pẹ̀lú ọpẹ́, ẹ máa fi ìbéèrè yín hàn fún Ọlọ́run.",
                    phoneticsYoruba: "Eh mah sheh ah-nee-yan nee-pah oh-hoon-koh-hoon; shoog-bawn nee nn-kan gbo-gbo..."
                },
                introduction: "Anxiety is an indicator that we are trying to carry burdens meant for God. Prayer is the holy channel through which human weakness exchanges heavy burdens for divine tranquility.",
                sections: [
                    { title: "1. Recognizing Anxiety Triggers", content: "Anxiety creeps in when we feel out of control. Recognizing this indicator prompts us to immediately turn to prayer." },
                    { title: "2. The Command to Pray in Everything", content: "Nothing is too small or too great to bring before God in prayer." },
                    { title: "3. The Secret Power of Thanksgiving", content: "Combining requests with thanksgiving shifts our posture from desperation to faith-filled gratitude." },
                    { title: "4. Divine Peace as a Guard", content: "God's peace acts like a garrison protecting our heart and mind from fear." },
                    { title: "5. Persistence without Losing Heart", content: "Jesus taught that we should always pray and never give up (Luke 18:1)." },
                    { title: "6. Building a Daily Prayer Habit", content: "Establish set times daily for quiet communion with God." }
                ],
                conclusion: "Cast your cares on the Lord today, and let His peace surround your life.",
                reflectionPrompts: [
                    { id: 'r1', label: "Key Lesson Revelation", question: "What insight did you gain regarding the connection between anxiety and prayer?" },
                    { id: 'r2', label: "Personal Application", question: "What specific burden will you hand over to God in prayer right now?" },
                    { id: 'r3', label: "Practical Commitment", question: "How will you restructure your morning routine to prioritize daily prayer?" }
                ],
                quiz: Array.from({ length: 30 }, (_, index) => ({
                    id: `q${index + 1}`,
                    question: `[Week 2 Question ${index + 1}] According to Philippians 4:6-7, how do we counter anxiety?`,
                    options: [
                        "By worrying more",
                        "By prayer and supplication with thanksgiving",
                        "By avoiding responsibility",
                        "By relying on human strength"
                    ],
                    correctAnswer: 1,
                    explanation: "Philippians 4:6 clearly commands us to make our requests known to God with thanksgiving."
                }))
            }
        ];

        // Educational Q&A Database
        const EDUCATIONAL_QA = [
            {
                id: 'edu-1',
                category: 'Secondary School',
                question: 'How do I prepare effectively for WAEC/UTME while maintaining my spiritual life?',
                answer: 'Create a balanced daily study timetable that allocates specific hours for revision, practice past questions, and set aside uninterrupted morning quiet time for Bible study and prayer. God grants wisdom to diligent minds.',
                tags: ['WAEC', 'UTME', 'Study Habits']
            },
            {
                id: 'edu-2',
                category: 'Secondary School',
                question: 'What should I do if I am confused about choosing between Science, Art, or Commercial classes?',
                answer: 'Evaluate your core strengths, interests, and career goals. Consult your school counselor, teachers, and parents, and pray for wisdom (James 1:5). Avoid choosing based on peer pressure.',
                tags: ['Subject Selection', 'Career Choice']
            },
            {
                id: 'edu-3',
                category: 'University & Tertiary',
                question: 'How can I maintain a high CGPA while active in campus fellowship?',
                answer: 'Time management is key. Prioritize lectures, study in groups, avoid last-minute cramming, and set boundaries. Fellowship builds character, but academic excellence honors God.',
                tags: ['CGPA', 'Time Management', 'Campus Life']
            },
            {
                id: 'edu-4',
                category: 'Job Seeking & Career',
                question: 'What are the top skills employers look for in fresh graduates today?',
                answer: 'Beyond your degree, cultivate digital literacy, problem-solving, effective communication, adaptability, teamwork, and continuous self-learning through online certifications.',
                tags: ['CV', 'Employability', 'Skills']
            },
            {
                id: 'edu-5',
                category: 'Job Seeking & Career',
                question: 'How do I handle job interview anxiety and rejection?',
                answer: 'Prepare thoroughly by researching the company and practicing common questions. View rejections as feedback for improvement, keep refining your skills, and trust God\'s timing for your open door.',
                tags: ['Interviews', 'Resilience']
            }
        ];

        // Welfare Initial Financial Data
        const INITIAL_WELFARE_DATA = {
            totalFund: 350000,
            currency: '₦',
            myContributionTotal: 15000,
            expenses: [
                { id: 'exp-1', title: 'Student Educational Support Grant', category: 'Scholarship', amount: 45000, date: 'Aug 14, 2026', approvedBy: 'Welfare Committee' },
                { id: 'exp-2', title: 'Emergency Medical Support for Member', category: 'Healthcare', amount: 30000, date: 'Aug 02, 2026', approvedBy: 'Welfare Board' },
                { id: 'exp-3', title: 'Monthly Community Relief Packages', category: 'Outreach', amount: 50000, date: 'Jul 28, 2026', approvedBy: 'Leader Team' }
            ],
            contributionsLog: [
                { id: 'c-1', name: 'Anonymous Member', amount: 10000, date: 'Aug 20, 2026', status: 'Verified' },
                { id: 'c-2', name: 'You (Personal Account)', amount: 5000, date: 'Aug 10, 2026', status: 'Verified' }
            ]
        };

        // Helper Audio Sound Generator
        const playAudioFx = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {
                // Audio Context unavailable or restricted
            }
        };

        // Main Application Component
        function App() {
            // Persistent State & Local Cache
            const [currentLessonId, setCurrentLessonId] = React.useState(() => {
                return localStorage.getItem('gp_active_lesson') || 'lesson-wk-1';
            });
            const [activeTab, setActiveTab] = React.useState('lesson'); 
            const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('gp_theme') === 'dark');
            const [isOfflineMode, setIsOfflineMode] = React.useState(false);
            const [showPWAInstallPrompt, setShowPWAInstallPrompt] = React.useState(true);
            const [toastMessage, setToastMessage] = React.useState(null);

            // User Profile & Gamification Points
            const [userPoints, setUserPoints] = React.useState(() => {
                return parseInt(localStorage.getItem('gp_user_points') || '150', 10);
            });
            const [userName, setUserName] = React.useState(() => {
                return localStorage.getItem('gp_user_name') || 'Beloved Student';
            });

            // Activity Records Stores
            const [completedLessons, setCompletedLessons] = React.useState(() => {
                const saved = localStorage.getItem('gp_completed_lessons');
                return saved ? JSON.parse(saved) : [];
            });
            const [readSectionsState, setReadSectionsState] = React.useState(() => {
                const saved = localStorage.getItem('gp_read_lessons');
                return saved ? JSON.parse(saved) : {};
            });
            const [quizScores, setQuizScores] = React.useState(() => {
                const saved = localStorage.getItem('gp_quiz_scores');
                return saved ? JSON.parse(saved) : {};
            });
            const [reflections, setReflections] = React.useState(() => {
                const saved = localStorage.getItem('gp_reflections');
                return saved ? JSON.parse(saved) : [];
            });
            const [memorizedVerses, setMemorizedVerses] = React.useState(() => {
                const saved = localStorage.getItem('gp_memorized');
                return saved ? JSON.parse(saved) : [];
            });
            const [welfareData, setWelfareData] = React.useState(() => {
                const saved = localStorage.getItem('gp_welfare');
                return saved ? JSON.parse(saved) : INITIAL_WELFARE_DATA;
            });
            const [streak] = React.useState(5);

            // Modals State
            const [showAskModal, setShowAskModal] = React.useState(false);
            const [showPrayerModal, setShowPrayerModal] = React.useState(false);

            // Effect: Dark Mode Toggle
            React.useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('gp_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('gp_theme', 'light');
                }
            }, [darkMode]);

            // Save Active Lesson
            React.useEffect(() => {
                localStorage.setItem('gp_active_lesson', currentLessonId);
            }, [currentLessonId]);

            // Sync with Google Apps Script Backend (if URL provided)
            const syncToBackend = async (action, payload) => {
                if (!APPS_SCRIPT_URL) {
                    console.log(`[Local Mode - No Apps Script URL set] Action: ${action}`, payload);
                    return;
                }
                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, user: userName, ...payload, timestamp: new Date().toISOString() })
                    });
                } catch (err) {
                    console.warn("Backend sync notice:", err);
                }
            };

            // Active Lesson Object
            const currentLesson = LESSONS_DATA.find(l => l.id === currentLessonId) || LESSONS_DATA[0];

            // Toast Trigger
            const triggerToast = (msg, icon = 'fa-circle-check') => {
                setToastMessage({ msg, icon });
                setTimeout(() => setToastMessage(null), 3800);
            };

            // Award Points
            const awardPoints = (pts, reason) => {
                const updated = userPoints + pts;
                setUserPoints(updated);
                localStorage.setItem('gp_user_points', updated.toString());
                triggerToast(`+${pts} Points Earned! (${reason})`, 'fa-star text-amber-400');
            };

            // Toggle Mark Lesson Complete
            const handleMarkLessonAsRead = (id) => {
                playAudioFx('success');
                const updatedRead = { ...readSectionsState, [id]: true };
                setReadSectionsState(updatedRead);
                localStorage.setItem('gp_read_lessons', JSON.stringify(updatedRead));

                if (!completedLessons.includes(id)) {
                    const updatedComplete = [...completedLessons, id];
                    setCompletedLessons(updatedComplete);
                    localStorage.setItem('gp_completed_lessons', JSON.stringify(updatedComplete));
                    awardPoints(50, 'Completed Lesson Reading');
                }

                syncToBackend('mark_read', { lessonId: id });
                triggerToast('Lesson Reading Marked Complete! Unlocked Reflection & Quiz.', 'fa-lock-open');
            };

            // Yoruba Text-To-Speech / Speech Synthesis Player
            const speakYorubaText = (text, phonetic) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'yo-NG'; // Yoruba Nigeria locale if available
                    utterance.rate = 0.85;
                    utterance.pitch = 1.0;

                    // Fallback to English voice pronouncing phonetic text if Yoruba voice absent
                    window.speechSynthesis.speak(utterance);
                    triggerToast('Playing Yoruba Audio Recitation...', 'fa-volume-high');
                } else {
                    triggerToast('Phonetics: ' + phonetic, 'fa-language');
                }
            };

            return (
                <div className="flex flex-col min-h-screen pb-24 md:pb-6 md:pt-16 max-w-5xl mx-auto px-3 sm:px-6">
                    
                    {/* Top Navigation Bar */}
                    <header className="fixed top-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 shadow-sm">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('lessons'); playAudioFx('click'); }}>
                                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                                    <i className="fa-solid fa-book-bible text-lg sm:text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-base tracking-tight text-slate-900 dark:text-white leading-tight flex items-center gap-2">
                                        GracePath
                                        <span className="text-[10px] font-bold bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-300 px-1.5 py-0.5 rounded uppercase tracking-wider">PWA</span>
                                    </h1>
                                    <p className="text-[11px] text-slate-500 dark:text-slate-400">Lesson, Guidance & Welfare Portal</p>
                                </div>
                            </div>

                            {/* Top Badges & Tools */}
                            <div className="flex items-center gap-2 sm:gap-3">
                                {/* Points Display */}
                                <div className="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 px-2.5 py-1 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-star text-amber-500"></i>
                                    <span>{userPoints} pts</span>
                                </div>

                                {/* Streak */}
                                <div className="hidden sm:flex items-center gap-1.5 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border border-rose-200/60 dark:border-rose-800/50 px-2.5 py-1 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-fire text-rose-500 animate-pulse"></i>
                                    <span>{streak} Days</span>
                                </div>

                                {/* Backend Sync Status Indicator */}
                                <button 
                                    onClick={() => triggerToast(APPS_SCRIPT_URL ? 'Connected to Google Apps Script' : 'Running in Offline / Local Mode (Configure APPS_SCRIPT_URL to sync live)', APPS_SCRIPT_URL ? 'fa-cloud' : 'fa-database')}
                                    className={`p-2 rounded-lg text-xs flex items-center gap-1 transition-colors ${APPS_SCRIPT_URL ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}`}
                                    title="Backend Database Sync Status"
                                >
                                    <i className={`fa-solid ${APPS_SCRIPT_URL ? 'fa-cloud-check' : 'fa-database'}`}></i>
                                </button>

                                {/* Theme Switcher */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                                    aria-label="Toggle Dark Mode"
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Desktop Tab Navigation */}

            const isMemorized = memorizedVerses.includes(lesson.id);

            const [maskLevel, setMaskLevel] = React.useState(0);
            const [userInput, setUserInput] = React.useState('');

            const textToDisplay = activeLang === 'english' ? verse.textEng : verse.textYoruba;
            const words = textToDisplay.split(' ');

            const renderMaskedText = () => {
                if (maskLevel === 0) return textToDisplay;

                return words.map((word, i) => {
                    if (maskLevel === 1 && i % 2 === 1) return '___ ';
                    if (maskLevel === 2 && i % 3 !== 0) return '___ ';
                    return word + ' ';
                }).join('');
            };

            const toggleMemorizedStatus = () => {
                playAudioFx('success');
                setMemorizedVerses(prev => {
                    const exists = prev.includes(lesson.id);
                    const updated = exists ? prev.filter(id => id !== lesson.id) : [...prev, lesson.id];
                    localStorage.setItem('gp_memorized', JSON.stringify(updated));
                    if (!exists) awardPoints(30, 'Mastered Verse');
                    triggerToast(exists ? 'Verse unmarked' : 'Verse Mastered! 🧠✨', 'fa-award');
                    return updated;
                });

        // 4. STRICT GUIDED REFLECTION SECTION (3 Questions)
        function ReflectionSection({ lesson, isLessonRead, reflections, setReflections, triggerToast, awardPoints, syncToBackend, onUnlockQuiz }) {
            const [answers, setAnswers] = React.useState({ r1: '', r2: '', r3: '' });
            const [validationError, setValidationError] = React.useState('');

            const handleInputChange = (id, val) => {
                setAnswers(prev => ({ ...prev, [id]: val }));
                if (validationError) setValidationError('');
            };

            const handleSubmitReflection = (e) => {
                e.preventDefault();

                if (!isLessonRead) {
                    triggerToast('Please complete reading the lesson content first!', 'fa-lock');
                    return;
                }

                // Strict Validation Check (Ensuring non-empty and minimum word count)
                const r1Words = answers.r1.trim().split(/\s+/).filter(Boolean).length;
                const r2Words = answers.r2.trim().split(/\s+/).filter(Boolean).length;
                const r3Words = answers.r3.trim().split(/\s+/).filter(Boolean).length;

                if (r1Words < 5 || r2Words < 5 || r3Words < 5) {
                    setValidationError('Please provide thoughtful answers (at least 5 words per prompt) for all 3 reflection questions.');
                    playAudioFx('error');
                    return;
                }

                playAudioFx('success');
                const newReflection = {
                    id: Date.now().toString(),
                    lessonId: lesson.id,
                    lessonTitle: lesson.title,
                    answers: answers,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                };

                const updated = [newReflection, ...reflections];
                setReflections(updated);
                localStorage.setItem('gp_reflections', JSON.stringify(updated));
                awardPoints(40, 'Submitted Lesson Reflection');
                syncToBackend('submit_reflection', { lessonId: lesson.id, answers });

                setAnswers({ r1: '', r2: '', r3: '' });
                triggerToast('Reflection Submitted & Recorded in Database! 📖', 'fa-paper-plane');
            };

            const lessonReflections = reflections.filter(r => r.lessonId === lesson.id);

            return (
                <div className="space-y-6 animate-fadeIn pb-12">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                        
                        <div className="flex items-center gap-2 text-teal-600 dark:text-teal-400 font-bold text-xs tracking-wider uppercase">
                            <i className="fa-solid fa-pen-to-square text-base"></i>
                            <span>STEP 2: MANDATORY GUIDED REFLECTION</span>
                        </div>

                        <div>
                            <h2 className="text-xl font-bold text-slate-900 dark:text-white">
                                {lesson.title}
                            </h2>
                            <p className="text-xs text-slate-500 mt-1">Answer all 3 reflection prompts thoroughly to record your progress.</p>
                        </div>

                        {!isLessonRead && (
                            <div className="p-4 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-2xl text-xs text-amber-800 dark:text-amber-300 flex items-center gap-2">
                                <i className="fa-solid fa-lock text-base"></i>
                                <span>You must read through the lesson content and click "Mark Lesson as Read" before submitting your reflection.</span>
                            </div>
                        )}

                        {validationError && (
                            <div className="p-4 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 rounded-2xl text-xs text-rose-800 dark:text-rose-300 font-semibold flex items-center gap-2">
                                <i className="fa-solid fa-triangle-exclamation text-base"></i>
                                <span>{validationError}</span>
                            </div>
                        )}

                                <div key={prompt.id} className="space-y-2">

                                        Question {idx + 1}: {prompt.question}
                                    </label>
                                    <textarea 
                                        disabled={!isLessonRead}
                                        value={answers[prompt.id] || ''}
                                        onChange={(e) => handleInputChange(prompt.id, e.target.value)}
                                        rows="3"
                                        placeholder="Type your thoughtful response here..."
                                        className="w-full p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-teal-500 outline-none leading-relaxed disabled:opacity-50"
                                    />
                                </div>
                            ))}

                            <button
                                type="submit"
                                disabled={!isLessonRead}
                                className="w-full py-4 bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-bold text-sm rounded-2xl shadow-md hover:opacity-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                            >
                                <i className="fa-solid fa-paper-plane"></i>
                                Submit Guided Reflection (+40 pts)

                        </form>
                    </div>

                    {/* Previous Reflection Submissions */}
                    <div className="space-y-4">
                        <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                            <i className="fa-solid fa-clock-rotate-left text-slate-400"></i>

        // 5. 30-QUESTION QUIZ ENGINE & PROGRESS RECORDING
        function QuizSection({ lesson, isLessonRead, quizScores, setQuizScores, triggerToast, awardPoints, syncToBackend }) {
            const quiz = lesson.quiz; // 30 Questions
            const [currentQ, setCurrentQ] = React.useState(0);
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [userAnswers, setUserAnswers] = React.useState({});
            const [isSubmitted, setIsSubmitted] = React.useState(false);

            const activeQuestion = quiz[currentQ];
            const previousScore = quizScores[lesson.id];

            const handleSelectOption = (idx) => {
                if (isSubmitted) return;
                playAudioFx('click');
                setSelectedOption(idx);
                setUserAnswers(prev => ({ ...prev, [currentQ]: idx }));
            };

            const handleNextQuestion = () => {
                if (selectedOption === null) {
                    triggerToast('Please select an option first', 'fa-exclamation-circle');
                    return;
                }

                if (currentQ < quiz.length - 1) {
                    setCurrentQ(prev => prev + 1);
                    setSelectedOption(userAnswers[currentQ + 1] ?? null);
                } else {
                    // Grade Quiz
                    let correctCount = 0;
                    quiz.forEach((q, index) => {
                        if (userAnswers[index] === q.correctAnswer) {
                            correctCount++;
                        }
                    });

                    const percentage = Math.round((correctCount / quiz.length) * 100);
                    const updatedScores = { ...quizScores, [lesson.id]: percentage };
                    setQuizScores(updatedScores);
                    localStorage.setItem('gp_quiz_scores', JSON.stringify(updatedScores));

                    setIsSubmitted(true);
                    playAudioFx(percentage >= 60 ? 'success' : 'error');

                    const pointsEarned = Math.round(percentage * 1.5);
                    awardPoints(pointsEarned, `Quiz Score: ${percentage}%`);

                    syncToBackend('submit_quiz', { lessonId: lesson.id, score: percentage, correctCount, total: quiz.length });
                }
            };

            const restartQuiz = () => {
                setCurrentQ(0);
                setSelectedOption(null);
                setUserAnswers({});
                setIsSubmitted(false);
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-12">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                        
                        <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-4">
                            <div>
                                <span className="text-xs font-bold px-3 py-1 rounded-md bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 uppercase tracking-wider">
                                    Weekly 30-Question Quiz Assessment
                                </span>
                                <h2 className="text-xl font-bold text-slate-900 dark:text-white mt-1">
                                    {lesson.title}
                                </h2>
                            </div>

                            {previousScore !== undefined && (
                                <div className="text-right">
                                    <span className="text-xs text-slate-400 font-semibold">Best Score</span>
                                    <p className="text-xl font-black text-indigo-600 dark:text-indigo-400">{previousScore}%</p>
                                </div>
                            )}
                        </div>

                        {!isLessonRead && (
                            <div className="p-4 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-2xl text-xs text-amber-800 dark:text-amber-300 flex items-center gap-2">
                                <i className="fa-solid fa-lock text-base"></i>
                                <span>Note: You can attempt the quiz, but reading the lesson first is highly recommended!</span>
                            </div>
                        )}

                        {!isSubmitted ? (
                            <div className="space-y-6">
                                {/* Quiz Progress Bar */}
                                <div>
                                    <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                        <span>Question {currentQ + 1} of {quiz.length}</span>
                                        <span>{Math.round(((currentQ + 1) / quiz.length) * 100)}% Completed</span>
                                    </div>
                                    <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full bg-indigo-600 transition-all duration-300"
                                            style={{ width: `${((currentQ + 1) / quiz.length) * 100}%` }}
                                        ></div>
                                    </div>
                                </div>

                                {/* Question Title */}
                                <h3 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">
                                    {activeQuestion.question}
                                </h3>

                                {/* Options */}
                                <div className="space-y-3">
                                    {activeQuestion.options.map((opt, idx) => {
                                        const isSelected = selectedOption === idx;

                                        return (
                                            <div 
                                                key={idx}
                                                onClick={() => handleSelectOption(idx)}
                                                className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-center justify-between text-sm sm:text-base ${
                                                    isSelected 
                                                        ? 'bg-indigo-50 dark:bg-indigo-950/40 border-indigo-500 text-indigo-900 dark:text-indigo-200 font-bold shadow-sm' 
                                                        : 'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-300'
                                                }`}
                                            >
                                                <span>{opt}</span>
                                                <div className={`w-5 h-5 rounded-full border flex items-center justify-center text-xs ${
                                                    isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 dark:border-slate-600'
                                                }`}>
                                                    {isSelected && <i className="fa-solid fa-check"></i>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Button Controls */}
                                <div className="flex items-center justify-between gap-3 pt-4">
                                    {currentQ > 0 && (
                                        <button 
                                            onClick={() => { setCurrentQ(currentQ - 1); setSelectedOption(userAnswers[currentQ - 1]); }}
                                            className="px-4 py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs rounded-xl"
                                        >
                                            Previous
                                        </button>
                                    )}

                                    <button 
                                        onClick={handleNextQuestion}
                                        className="flex-grow py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                                    >
                                        <span>{currentQ < quiz.length - 1 ? 'Next Question' : 'Submit Final Quiz'}</span>
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        ) : (
                            /* Results Overview */
                            <div className="text-center py-6 space-y-6 animate-fadeIn">
                                <div className="w-20 h-20 mx-auto rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 flex items-center justify-center text-3xl shadow-inner">
                                    <i className="fa-solid fa-trophy"></i>
                                </div>

                                <div>
                                    <h3 className="text-2xl font-black text-slate-900 dark:text-white">Quiz Evaluation Completed!</h3>
                                    <p className="text-xs text-slate-500 mt-1">Your response record has been registered to your personal progress dashboard.</p>
                                </div>

                                <div className="text-4xl font-black text-indigo-600 dark:text-indigo-400">
                                    {quizScores[lesson.id]}% Score
                                </div>

                                <button 
                                    onClick={restartQuiz}
                                    className="px-6 py-3 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 font-bold text-xs rounded-xl shadow hover:opacity-90 inline-flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-rotate-right"></i>
                                    Retake 30-Question Quiz
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

                if (isNaN(amt) || amt <= 0) {
                    triggerToast('Please enter a valid contribution amount', 'fa-exclamation-triangle');
                    return;
                }

                playAudioFx('success');
                const newContrib = {
                    id: Date.now().toString(),
                    name: donorName.trim() || 'Anonymous Member',
                    amount: amt,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    status: 'Verified'
                };

                const updatedData = {
                    ...welfare,
                    totalFund: welfare.totalFund + amt,
                    myContributionTotal: welfare.myContributionTotal + amt,
                    contributionsLog: [newContrib, ...welfare.contributionsLog]
                };

                setWelfareData(updatedData);
                localStorage.setItem('gp_welfare', JSON.stringify(updatedData));
                syncToBackend('record_contribution', newContrib);

                setContribAmount('');
                setDonorName('');
                triggerToast('Contribution Logged & Synced with Welfare Records!', 'fa-hand-holding-dollar');
            };

                <div className="space-y-6 animate-fadeIn pb-12">
                    
                    {/* Financial Dashboard Banner */}
                    <div className="bg-gradient-to-r from-emerald-800 via-teal-800 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl space-y-4">
                        <span className="text-xs uppercase font-bold text-emerald-300 tracking-wider">Community Welfare & Relief Fund</span>
                        
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <p className="text-xs text-emerald-200">Total Verified Fund Balance</p>
                                <p className="text-3xl sm:text-4xl font-black">{welfare.currency}{welfare.totalFund.toLocaleString()}</p>
                            </div>

                            <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10 text-right">
                                <p className="text-xs text-emerald-200">Your Personal Contribution</p>
                                <p className="text-xl font-bold text-emerald-300">{welfare.currency}{welfare.myContributionTotal.toLocaleString()}</p>

                        </div>
                    </div>

                            Record a Welfare Contribution / Offering Pledge
                        </h3>

                        <form onSubmit={handleLogContribution} className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <input 
                                type="text"
                                value={donorName}
                                onChange={(e) => setDonorName(e.target.value)}
                                placeholder="Your Name (Optional)"
                                className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                            />
                            <input 
                                type="number"
                                value={contribAmount}
                                onChange={(e) => setContribAmount(e.target.value)}
                                placeholder="Amount (e.g. 5000)"
                                className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                            />
                            <button
                                type="submit"
                                className="py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition-colors flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-paper-plane"></i>
                                Submit Contribution
                            </button>
                        </form>
                    </div>

                    {/* Itemized Expenses & Contributions Ledger */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Expenses Breakdown */}
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                                <i className="fa-solid fa-receipt text-rose-500"></i>
                                Itemized Welfare Disbursements & Expenses
                            </h3>

                            <div className="space-y-3">
                                {welfare.expenses.map((exp) => (
                                    <div key={exp.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between text-xs">
                                        <div>
                                            <p className="font-bold text-slate-900 dark:text-white">{exp.title}</p>
                                            <p className="text-[10px] text-slate-400">{exp.category} • {exp.date} • Approved by {exp.approvedBy}</p>
                                        </div>
                                        <span className="font-extrabold text-rose-600 dark:text-rose-400 text-sm">
                                            -{welfare.currency}{exp.amount.toLocaleString()}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Recent Contributions Log */}
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                                <i className="fa-solid fa-list-check text-emerald-500"></i>
                                Verified Contributions Log
                            </h3>

                            <div className="space-y-3">
                                {welfare.contributionsLog.map((log) => (
                                    <div key={log.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between text-xs">
                                        <div>
                                            <p className="font-bold text-slate-900 dark:text-white">{log.name}</p>
                                            <p className="text-[10px] text-slate-400">{log.date} • {log.status}</p>
                                        </div>
                                        <span className="font-extrabold text-emerald-600 dark:text-emerald-400 text-sm">
                                            +{welfare.currency}{log.amount.toLocaleString()}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        // 8. DASHBOARD & PERSONAL ACCOUNT SECTION
        function DashboardSection({ userName, setUserName, userPoints, lessons, completedLessons, quizScores, reflections, memorizedVerses, welfare }) {
            const [isEditingName, setIsEditingName] = React.useState(false);
            const [tempName, setTempName] = React.useState(userName);

            const handleSaveName = () => {
                const name = tempName.trim() || 'Beloved Student';
                setUserName(name);
                localStorage.setItem('gp_user_name', name);
                setIsEditingName(false);
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-12">
                    
                    {/* User Profile Card */}
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 text-white flex items-center justify-center text-2xl font-black shadow-md">
                                {userName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                {isEditingName ? (
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="text" 
                                            value={tempName} 
                                            onChange={(e) => setTempName(e.target.value)}
                                            className="p-2 border rounded-xl text-xs bg-slate-50 dark:bg-slate-900"
                                        />
                                        <button onClick={handleSaveName} className="px-3 py-1 bg-brand-600 text-white rounded-lg text-xs font-bold">Save</button>
                                    </div>
                                ) : (
                                    <h2 className="text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                                        {userName}
                                        <button onClick={() => setIsEditingName(true)} className="text-xs text-slate-400 hover:text-brand-600">
                                            <i className="fa-solid fa-pen"></i>
                                        </button>
                                    </h2>
                                )}
                                <p className="text-xs text-slate-500">Student Account & Personal Database</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="text-right">
                                <span className="text-xs text-slate-400">Total Reward Points</span>
                                <p className="text-2xl font-black text-amber-500">{userPoints} pts</p>
                            </div>
                        </div>
                    </div>

                    {/* Overall Progress Stats */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                            <p className="text-2xl font-black text-brand-600 dark:text-brand-400">{completedLessons.length}/{lessons.length}</p>
                            <p className="text-xs text-slate-500">Lessons Completed</p>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                            <p className="text-2xl font-black text-purple-600 dark:text-purple-400">{memorizedVerses.length}</p>
                            <p className="text-xs text-slate-500">Yoruba Verses</p>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                            <p className="text-2xl font-black text-teal-600 dark:text-teal-400">{reflections.length}</p>
                            <p className="text-xs text-slate-500">Reflections Saved</p>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                            <p className="text-2xl font-black text-emerald-600 dark:text-emerald-400">₦{welfare.myContributionTotal.toLocaleString()}</p>
                            <p className="text-xs text-slate-500">Contributed Fund</p>
                        </div>
                    </div>

                </div>
            );
        }

        // ASK A QUESTION MODAL
        function AskQuestionModal({ onClose, triggerToast, syncToBackend }) {
            const [qText, setQText] = React.useState('');
            const [qCategory, setQCategory] = React.useState('Secondary School');
            const [privacy, setPrivacy] = React.useState('public');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!qText.trim()) return;

                syncToBackend('ask_question', { category: qCategory, question: qText, privacy });
                triggerToast('Question Submitted to Counselor Desk!', 'fa-paper-plane');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                                <i className="fa-solid fa-circle-question text-cyan-600"></i> Ask Counselor / Teacher
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            <div>
                                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Select Category</label>
                                <select 
                                    value={qCategory} 
                                    onChange={(e) => setQCategory(e.target.value)}
                                    className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
                                >
                                    <option value="Secondary School">Secondary School</option>
                                    <option value="University & Tertiary">University & Tertiary</option>
                                    <option value="Job Seeking & Career">Job Seeking & Career</option>
                                </select>
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Your Question</label>
                                <textarea 
                                    rows="4" 
                                    value={qText} 
                                    onChange={(e) => setQText(e.target.value)}
                                    placeholder="Type your question here in detail..."
                                    className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Response Privacy Preference</label>
                                <div className="flex gap-4">
                                    <label className="flex items-center gap-1.5 cursor-pointer">
                                        <input type="radio" name="privacy" value="public" checked={privacy === 'public'} onChange={() => setPrivacy('public')} />
                                        <span>Public (Share in Q&A hub for others)</span>
                                    </label>
                                    <label className="flex items-center gap-1.5 cursor-pointer">
                                        <input type="radio" name="privacy" value="private" checked={privacy === 'private'} onChange={() => setPrivacy('private')} />
                                        <span>Private (Direct reply)</span>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" className="w-full py-3 bg-cyan-700 text-white font-bold rounded-xl shadow">
                                Submit Question
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // PRAYER REQUEST MODAL
        function PrayerRequestModal({ onClose, triggerToast, syncToBackend }) {
            const [requestText, setRequestText] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!requestText.trim()) return;

                syncToBackend('prayer_request', { text: requestText });
                triggerToast('Confidential Prayer Request Sent to Intercessors 🙏', 'fa-hands-praying');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                                <i className="fa-solid fa-hands-praying text-amber-500"></i> Submit Prayer Request
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            <div>
                                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Your Prayer Request</label>
                                <textarea 
                                    rows="5" 
                                    value={requestText} 
                                    onChange={(e) => setRequestText(e.target.value)}
                                    placeholder="Write your personal prayer request here. It will be kept confidential..."
                                    className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
                                />
                            </div>

                            <button type="submit" className="w-full py-3 bg-amber-600 text-white font-bold rounded-xl shadow">
                                Send Prayer Request
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
